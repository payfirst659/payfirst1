<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PayFirst1 - Mobile Recharge</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      padding: 25px 15px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #25D366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1ebe5d;
    }

    #plans {
      display: none;
      margin-top: 20px;
    }

    .plan {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      cursor: pointer;
    }

    .plan:hover {
      background: #f1fff5;
    }

    .plan input {
      width: auto;
      margin-right: 8px;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">PayFirst1</div>

  <form id="rechargeForm">

    <!-- Mobile Number -->
    <label>📱 Mobile Number</label>
    <input
      type="tel"
      id="mobile"
      placeholder="Enter 10-digit mobile number"
      maxlength="10"
      inputmode="numeric"
      pattern="[0-9]{10}"
      required
    >

    <!-- SIM Operator -->
    <label>📶 SIM Operator</label>
    <select id="operator" required>
      <option value="">Select SIM Operator</option>
      <option value="Jio">Jio</option>
      <option value="Airtel">Airtel</option>
      <option value="Vi">Vi</option>
      <option value="BSNL">BSNL</option>
    </select>

    <!-- WhatsApp Number -->
    <label>💬 WhatsApp Number</label>
    <input
      type="tel"
      id="whatsapp"
      placeholder="Enter 10-digit WhatsApp number"
      maxlength="10"
      inputmode="numeric"
      pattern="[0-9]{10}"
      required
    >

    <!-- View Plans -->
    <button type="button" onclick="viewPlans()">
      View Recharge Plans
    </button>

    <!-- Plans -->
    <div id="plans">

      <label>Select the Plan</label>

      <div class="plan">
        <input type="radio" name="plan" value="199">
        ₹199 — 1.5GB/day — 28 Days
      </div>

      <div class="plan">
        <input type="radio" name="plan" value="299">
        ₹299 — 2GB/day — 28 Days
      </div>

      <div class="plan">
        <input type="radio" name="plan" value="399">
        ₹399 — 2.5GB/day — 28 Days
      </div>

      <!-- Submit -->
      <button type="submit">
        🔘 Submit / Continue
      </button>

    </div>

    <div id="message"></div>

  </form>

</div>


<script>

function viewPlans() {

  const mobile = document.getElementById("mobile").value;
  const operator = document.getElementById("operator").value;
  const whatsapp = document.getElementById("whatsapp").value;

  if (!/^[0-9]{10}$/.test(mobile)) {
    alert("Please enter a valid 10-digit Mobile Number.");
    return;
  }

  if (operator === "") {
    alert("Please select SIM Operator.");
    return;
  }

  if (!/^[0-9]{10}$/.test(whatsapp)) {
    alert("Please enter a valid 10-digit WhatsApp Number.");
    return;
  }

  document.getElementById("plans").style.display = "block";
}


const BACKEND_URL = "https://payfirst-backend-1.onrender.com";

document.getElementById("rechargeForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const selectedPlan = document.querySelector(
    'input[name="plan"]:checked'
  );

  if (!selectedPlan) {
    alert("Please select a recharge plan.");
    return;
  }

  const mobile = document.getElementById("mobile").value;
  const operator = document.getElementById("operator").value;
  const whatsapp = document.getElementById("whatsapp").value;
  const plan = selectedPlan.value;

  const message = document.getElementById("message");

  message.textContent = "Sending request...";

  try {
    const response = await fetch(
      BACKEND_URL + "/api/recharge-request",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mobileNumber: mobile,
          operator: operator,
          whatsappNumber: whatsapp,
          selectedPlan: "₹" + plan
        })
      }
    );

    const result = await response.json();

    if (result.success) {
      message.textContent =
        "Recharge request submitted successfully!";
    } else {
      message.textContent =
        result.message || "Request failed.";
    }

  } catch (error) {
    message.textContent =
      "Backend se connection nahi ho raha.";
    console.error(error);
  }

});

</script>

</body>
</html>
