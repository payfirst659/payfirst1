<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFirst1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 15px;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>PayFirst1</h1>

    <form>

      <!-- Mobile Number -->
      <label>Mobile Number</label>
      <input
        type="tel"
        placeholder="Enter Mobile Number"
        maxlength="10"
        pattern="[0-9]{10}"
        inputmode="numeric"
        required
      >

      <!-- SIM Operator -->
      <label>SIM Operator</label>
      <select required>
        <option value="">Select SIM Operator</option>
        <option value="Jio">Jio</option>
        <option value="Airtel">Airtel</option>
        <option value="Vi">Vi</option>
        <option value="BSNL">BSNL</option>
      </select>

      <!-- WhatsApp Number -->
      <label>WhatsApp Number</label>
      <input
        type="tel"
        placeholder="Enter 10-digit WhatsApp Number"
        maxlength="10"
        pattern="[0-9]{10}"
        inputmode="numeric"
        required
      >

      <button type="submit">
        Continue
      </button>

    </form>

  </div>

</body>
</html>
